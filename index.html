<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>쓰레드 복붙판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&family=Nanum+Gothic+Coding&display=swap">
<style>
/* 폰 한 손 조작: 위에 날짜·계정 고정 바, 아래로 그날 그 계정 글 2장 */
:root{
 --bg:#f3f2ef; --card:#ffffff; --fg:#17161a; --muted:#6d6a73; --line:#dcd9d3;
 --accent:#2b5cd9; --accent-fg:#ffffff; --done:#1f8a5b; --chip:#e7e5e0;
 --display:"Gothic A1",system-ui,sans-serif; --body:"Gothic A1",system-ui,sans-serif;
 --mono:"Nanum Gothic Coding",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#121114; --card:#1d1c20; --fg:#efedf2; --muted:#9a96a1; --line:#2e2c33;
 --accent:#7b9dff; --accent-fg:#0d0d10; --done:#4cc28c; --chip:#28262c; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#121114; --card:#1d1c20; --fg:#efedf2; --muted:#9a96a1; --line:#2e2c33;
 --accent:#7b9dff; --accent-fg:#0d0d10; --done:#4cc28c; --chip:#28262c; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
 padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
 display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.01em;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 8px}
h1 small{font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;
 padding:7px 12px;font:600 13px var(--body);cursor:pointer;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip .n{font-weight:400;opacity:.8;font-size:12px}
.chip.all-done:not([aria-pressed="true"]){color:var(--done);border-color:var(--done)}
main{padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
 display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.who{font-size:13px;color:var(--muted)}
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.post.done{opacity:.5}
.meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.slot{font-weight:800;color:var(--fg);font-size:13px}
.text{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:15.5px;line-height:1.6;margin:0;font-family:var(--body);user-select:text}
.actions{display:flex;gap:8px}
button.copy{flex:1;border:0;border-radius:10px;padding:13px;background:var(--accent);color:var(--accent-fg);font:800 15px var(--body);cursor:pointer}
button.copy.ok{background:var(--done)}
label.mark{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:13px;cursor:pointer;white-space:nowrap}
label.mark input{width:18px;height:18px;accent-color:var(--done)}
button:focus-visible,.chip:focus-visible,label.mark:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.todo{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.todo.done{opacity:.5}
.head-btn{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:3px 9px;font:600 12px var(--body);cursor:pointer}
.tip{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
@media (prefers-reduced-motion:no-preference){button.copy{transition:background .15s}}
</style>
<header class="bar">
 <h1><span>쓰레드 복붙판 <button class="head-btn" id="share" type="button">링크 공유</button></span><small id="sum"></small></h1>
 <div class="row" id="dates" role="group" aria-label="날짜"></div>
 <div class="row" id="accs" role="group" aria-label="계정"></div>
</header>
<main id="list"></main>
<script id="data" type="application/json">{"accounts": {"1": "26 사무직 신입", "2": "24 취준생", "3": "29 자취 5년차", "4": "31 신혼", "5": "27 다이어트·피부", "6": "28 교대근무 간호사", "7": "32 프리랜서·집사"}, "posts": [{"account": 1, "day": 0, "slot": "글1", "formula": "위로", "text": "누워서 회사 걱정하는 사람 손 🙌🏻\n\n나도 맨날 그래\n그만큼 열심히 살고 있다는 얘기야\n\n너무 자책하지 말자 우리"}, {"account": 2, "day": 0, "slot": "글1", "formula": "실패담", "text": "최종면접 가서 떨어짐\n\n이번엔 된다고 엄마한테 미리 말했거든\n문자 보고 엄마한테 뭐라 할지가 더 막막했어\n\n엄마는 \"수고했다 밥 먹자\" 한마디 하심 ㅠㅠ"}, {"account": 3, "day": 0, "slot": "글1", "formula": "응원", "text": "혼자 밥 차려 먹은 사람 칭찬함 🍳\n\n계란 프라이 하나여도 챙겨 먹었잖아\n그런 날 쌓이는 게 어른 되는 거더라"}, {"account": 4, "day": 0, "slot": "글1", "formula": "위로", "text": "친구들 애 키우는데 나만 뒤처진 거 같은 사람\n\n단톡방에 애기 사진 올라오면 괜히 말 줄어들어\n속도는 다 다른 거잖아\n\n맞는 길은 아무도 몰라 💙"}, {"account": 5, "day": 0, "slot": "글1", "formula": "실패담", "text": "런지 20개 하고 3일 동안 계단 못 내려감\n\n결국 뒤로 걸어서 내려갔는데\n회사 사람이 봄 ㅋㅋㅠ\n\n그 뒤로 인사가 \"다리 괜찮아요?\" 됨"}, {"account": 6, "day": 0, "slot": "글1", "formula": "응원", "text": "고맙다는 말 한 번도 못 들은 날 있지\n\n내가 대신 말할게 고생했어 정말 고마워\n쌤 덕에 누군가는 덜 아팠을 거야\n\n💙 남기고 가"}, {"account": 7, "day": 0, "slot": "글1", "formula": "위로", "text": "혼자 밥 먹다 갑자기 울컥한 사람\n\n별일도 없었는데 그런 날 있어\n고양이가 옆에 와서 앉아주면 더 눈물 남 ㅋㅋㅠ\n\n울어도 괜찮아"}, {"account": 1, "day": 1, "slot": "글1", "formula": "위로", "text": "회사에서 혼자 작아진 사람🙌🏻\n\n말 한마디 잘못한 거 같아서 집 와서도 계속 곱씹지\n근데 그거 아무도 기억 안 해\n\n나도 그렇게 1년 버텼어"}, {"account": 1, "day": 1, "slot": "글2", "formula": "실패담", "text": "회의실 예약 날짜를 통째로 틀림\n\n부장님이랑 거래처 분 복도에 세워놓고\n빈 회의실 찾아 뛰어다녔어 ㅠㅠ\n\n화장실에서 5분 울고 나왔는데\n이제 예약할 때 세 번씩 확인함"}, {"account": 2, "day": 1, "slot": "글1", "formula": "실패담", "text": "서류 탈락 11번째 받고 바로 알바 감\n\n웃으면서 어서오세요 하는데 눈물 날 뻔했어\n일 끝나고 컵라면 먹으면서 12번째 씀\n\n이쯤 되면 탈락도 특기임 ㅋㅋㅠ"}, {"account": 2, "day": 1, "slot": "글2", "formula": "응원", "text": "취준 중인 사람들 여기 손🙌🏻\n\n아무것도 안 된 것 같아도\n자소서 붙잡고 있는 너 진짜 대단한 거야\n\n우리 같이 붙자"}, {"account": 3, "day": 1, "slot": "글1", "formula": "응원", "text": "혼자 사는 사람들 오늘도 잘 살아냄\n\n밥 챙겨 먹고 빨래 돌리고 쓰레기 버린 거\n그거 다 네가 혼자 한 거잖아\n\n생각보다 대단한 거야"}, {"account": 3, "day": 1, "slot": "글2", "formula": "위로", "text": "아플 때 제일 서러운 게 자취지\n\n열 39도인데 죽 사러 내가 나가야 함 ㅠㅠ\n5년 차인데도 아프면 엄마 생각나\n\n혼자 아픈 사람 얼른 나아 진짜로"}, {"account": 4, "day": 1, "slot": "글1", "formula": "위로", "text": "결혼했는데 왜 이렇게 외롭지 싶은 사람\n\n나도 신혼인데 혼자 우는 날 있어\n맞춰가는 중이라 그런 거래\n\n너만 그런 거 아니야"}, {"account": 4, "day": 1, "slot": "글2", "formula": "실패담", "text": "시부모님 오신 날 미역국이 소금국 됨\n\n아버님이 말없이 물 타서 드심 ㅠㅠ\n남편은 옆에서 맛있다고 거짓말하고\n\n그날 이후로 미역국 안 끓임 ㅋㅋ"}, {"account": 5, "day": 1, "slot": "글1", "formula": "실패담", "text": "2주 굶어서 뺀 3키로 3일 만에 돌아옴\n\n닭가슴살만 먹다가 친구 생일에 뷔페 갔거든\n접시 7번 왕복하고 체중계 안 올라감 ㅋㅋㅠ\n\n다시 시작이다 진짜로"}, {"account": 5, "day": 1, "slot": "글2", "formula": "응원", "text": "다이어트 또 망한 사람들 여기로🙌🏻\n\n한 끼 망했다고 다 망한 거 아니야\n다음 끼니부터 다시 하면 됨\n\n나도 이 말로 6키로 뺐어"}, {"account": 6, "day": 1, "slot": "글1", "formula": "응원", "text": "교대근무 하는 사람들 진짜 대단해\n\n남들 잘 때 일하고 남들 일할 때 자는 거\n안 해본 사람은 몰라\n\n무사히 끝내자 우리"}, {"account": 6, "day": 1, "slot": "글2", "formula": "위로", "text": "밥 못 먹고 일한 날 있지\n\n화장실도 못 가고 8시간 뛰었는데\n집 와서 보니 손에 볼펜 자국만 ㅋㅋㅠ\n\n아무도 몰라줘도 내가 알아 고생했어"}, {"account": 7, "day": 1, "slot": "글1", "formula": "위로", "text": "통장 보기 무서운 프리랜서 여기🙌🏻\n\n들쭉날쭉한 거 우리만 아는 불안이지\n일 없는 달에도 네 실력은 그대로야\n\n나도 작년에 두 달 쉬었어"}, {"account": 7, "day": 1, "slot": "글2", "formula": "실패담", "text": "견적서에 0 하나 빼먹고 보냄\n\n300만원짜리를 30만원으로 ㅠㅠ\n\"감사합니다 바로 진행할게요\" 답장 오는데 손 떨림\n\n3일 고민하다 겨우 사과 메일 씀"}, {"account": 1, "day": 2, "slot": "글1", "formula": "실패담", "text": "엑셀 수식 잘못 걸어서 보고서 숫자 다 틀림\n\n팀장님이 \"이거 뭐야?\" 하는데 심장 내려앉음..\n그날 이후로 내 별명 엑셀 신입 됨 ㅋㅋㅠ"}, {"account": 1, "day": 2, "slot": "글2", "formula": "응원", "text": "신입인데 일 못하는 거 같아서 속상한 사람\n\n원래 1년은 다 그래\n내 사수도 첫해에 거래처 이름 틀렸대 ㅋㅋ\n\n우리 잘 버티고 있어 💪"}, {"account": 2, "day": 2, "slot": "글1", "formula": "응원", "text": "친구 합격 소식에 축하해놓고 혼자 운 사람\n\n나쁜 사람 아니야 당연한 거야\n너도 곧 축하받을 차례 🍀"}, {"account": 2, "day": 2, "slot": "글2", "formula": "위로", "text": "엄마가 밥 먹었냐고 물어보는데 왜 눈물 나지\n\n취준 오래 하면 작은 말에도 무너지더라\n\n조금 울고 다시 하자 괜찮아"}, {"account": 3, "day": 2, "slot": "글1", "formula": "위로", "text": "불 꺼진 집에 들어올  🍀"}, {"account": 5, "day": 7, "slot": "스하리", "formula": "스하리", "text": "살은 안 빠져도 스친은 늘려보자 ㅋㅋ\n\n리포스트가 그렇게 중요하대\n천명 안 된 사람 스하리 남겨줘 반하리 꼭 감🍀"}, {"account": 6, "day": 7, "slot": "글1", "formula": "위로", "text": "출근 전에 이유 없이 눈물 나는 사람\n\n나도 그런 적 많아\n오래 그러면 혼자 참지 말고 누구한테든 꼭 말하자\n\n버티느라 고생 많아"}, {"account": 6, "day": 7, "slot": "스하리", "formula": "스하리", "text": "힘든 날 얘기할 스친 있으면 좀 낫더라\n\n천명 안 된 사람 서로 밀어주자\n스하리 남겨줘 늦어도 반하리 꼭 갈게 💙"}, {"account": 7, "day": 7, "slot": "글1", "formula": "실패담", "text": "고양이 셀프 미용 했다가 쥐 파먹은 것처럼 만듦\n\n걔는 3일 동안 나 안 쳐다봄\n미용실 데려갔더니 \"누가 이랬어요?\" 하심 ㅋㅋㅋ\n\n제가요.."}, {"account": 7, "day": 7, "slot": "스하리", "formula": "스하리", "text": "혼자 일할수록 서로 밀어주는 사람이 필요하더라\n\n리포스트가 엄청 중요하대🍀\n천명 안 된 사람 스하리 남겨줘 반하리 꼭 갈게"}], "slots": ["글1", "글2", "스하리"], "actionFrom": 3, "api": ""}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const P=D.posts, A=D.accounts;
const days=[...new Set(P.map(p=>p.day))].sort((a,b)=>a-b);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v?localStorage.setItem(k,v===true?'1':v):localStorage.removeItem(k)}catch(e){}}};
const V='thr2:';  // 원고 새로 바꾸면 숫자 올림: 옛 글에 눌러둔 [올렸음]이 새 글에 묻어나지 않게
const key=p=>V+p.day+':'+p.account+':'+p.slot;
const API=D.api, pend={};
let R={},online=null;
try{R=JSON.parse(store.get(V+'cache')||'{}')}catch(e){}
const isDone=k=>API?!!R[k]:!!store.get(k);
const same=(a,b)=>JSON.stringify(Object.keys(a).sort())===JSON.stringify(Object.keys(b).sort());
function setDone(k,v){
 if(!API){store.set(k,v);render();return}
 const was=!!R[k];if(v)R[k]='1';else delete R[k];pend[k]=(pend[k]||0)+1;store.set(V+'cache',JSON.stringify(R));render();
 fetch(API+'?op=set&k='+encodeURIComponent(k)+'&v='+(v?1:0)).then(r=>r.json()).then(j=>{if(!j.ok)throw 0;online=true})
  .catch(()=>{if(was)R[k]='1';else delete R[k];online=false;store.set(V+'cache',JSON.stringify(R))})
  .finally(()=>{pend[k]--;if(!pend[k])delete pend[k];render()})}
function pull(){ // 다른 기기에서 누른 체크 가져오기
 if(!API||document.hidden)return;
 fetch(API+'?op=get').then(r=>r.json()).then(j=>{online=true;
  if(!Object.keys(pend).length&&!same(j.data,R)){R=j.data;store.set(V+'cache',JSON.stringify(R));render()}else status()})
  .catch(()=>{online=false;status()})}
function status(){const all=P.filter(p=>isDone(key(p))).length;
 const net=!API?'이 기기에만 저장':online===false?'연결 안 됨·체크 저장 안 됨':'모든 기기 공유';
 document.getElementById('sum').textContent='올림 '+all+' / '+P.length+' · '+net}
let curDay=Number(store.get(V+'day'))||days[0];if(!days.includes(curDay))curDay=days[0];
let curAcc=Number(store.get(V+'acc'))||1;
function lab(d){return d+'일차'}
function chip(text,n,pressed,onclick,allDone){const b=document.createElement('button');b.className='chip'+(allDone?' all-done':'');
 b.setAttribute('aria-pressed',pressed);b.innerHTML='<span></span><span class="n"></span>';b.firstChild.textContent=text;b.lastChild.textContent=n;b.onclick=onclick;return b}
function render(){
 const dd=document.getElementById('dates'),aa=document.getElementById('accs'),L=document.getElementById('list');
 dd.replaceChildren(...days.map(d=>{const ps=P.filter(p=>p.day===d),k=ps.filter(p=>isDone(key(p))).length;
  return chip(lab(d),k+'/'+ps.length,d===curDay,()=>{curDay=d;store.set(V+'day',String(d));render()},k===ps.length)}));
 aa.replaceChildren(...Object.keys(A).map(Number).map(a=>{const ps=P.filter(p=>p.day===curDay&&p.account===a),k=ps.filter(p=>isDone(key(p))).length;
  return chip(a+'번',k+'/'+ps.length,a===curAcc,()=>{curAcc=a;store.set(V+'acc',String(a));render()},ps.length&&k===ps.length)}));
 status();
 const ps=P.filter(p=>p.day===curDay&&p.account===curAcc).sort((a,b)=>D.slots.indexOf(a.slot)-D.slots.indexOf(b.slot));
 const who=document.createElement('div');who.className='who';who.textContent=curAcc+'번 계정 · '+A[curAcc]+' · '+lab(curDay);
 L.replaceChildren(who,...ps.map(card),...(curDay>=D.actionFrom?[todo()]:[]),tip());
 const s=dd.querySelector('[aria-pressed="true"]');s&&s.scrollIntoView({inline:'center',block:'nearest'});
}
function card(p){
 const c=document.createElement('article');c.className='post'+(isDone(key(p))?' done':'');
 c.innerHTML='<div class="meta"><span class="slot"></span><span class="tag"></span></div><p class="text"></p><div class="actions"><button class="copy" type="button">복사</button><label class="mark"><input type="checkbox">올렸음</label></div>';
 c.querySelector('.slot').textContent=p.slot==='글1'?'글 ①':p.slot==='글2'?'글 ②':'스하리글';
 const tg=c.querySelector('.tag');if(p.formula===p.slot)tg.remove();else tg.textContent=p.formula;
 const t=c.querySelector('.text');t.textContent=p.text;
 const b=c.querySelector('.copy');b.onclick=()=>copy(p.text,t,b);
 const m=c.querySelector('input');m.id='m-'+p.day+'-'+p.account+'-'+p.slot;m.checked=!!isDone(key(p));
 m.onchange=()=>setDone(key(p),m.checked);
 return c}
function todo(){const k=V+curDay+':'+curAcc+':act',d=document.createElement('label');d.className='todo'+(isDone(k)?' done':'');
 d.innerHTML='<span>이 계정 맞팔·좋아요 2개</span><input type="checkbox" style="width:20px;height:20px">';
 const m=d.querySelector('input');m.checked=isDone(k);m.onchange=()=>setDone(k,m.checked);return d}
function tip(){const d=document.createElement('p');d.className='tip';
 d.textContent='글 ① 올리고 2시간 넘게 지나서 글 ② 올리기. 하루에 한 일차씩. 스하리글에 반응 오면 맞팔·좋아요로 갚기. 조회수 1,000 넘은 글은 시트에 적어두고 다시 올리기.';return d}
function flash(b,msg){b.textContent=msg;b.classList.add('ok');setTimeout(()=>{b.textContent='복사';b.classList.remove('ok')},1500)}
function copy(text,el,b){
 const fallback=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}flash(b,ok?'복사됨':'글이 선택됨 · 길게 눌러 복사')};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>flash(b,'복사됨'),fallback)}else fallback()}
document.getElementById('share').onclick=e=>{const u=location.href.split('#')[0],b=e.target;
 const ok=()=>{b.textContent='복사됨';setTimeout(()=>b.textContent='링크 공유',1500)};
 if(navigator.share)navigator.share({title:'쓰레드 복붙판',url:u}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(ok);else prompt('이 주소를 복사하세요',u)};
render();pull();setInterval(pull,15000);addEventListener('focus',pull);document.addEventListener('visibilitychange',pull);
</script>
